<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZSIGNAL™</title>
  <link rel="stylesheet" href="css/tokens.css?v=11">
  <link rel="stylesheet" href="css/z-gallery.css?v=11">
</head>
<body class="spatial-mode">
  <div class="zs-noise-overlay"></div>
  
  <!-- YZAVOKU HUB -->
  <div class="spatial-hub">
    <h1>ZSIGNAL™</h1>
  </div>

  <nav class="spatial-nav">
    <a href="gallery.html">Archive</a>
    <a href="studio.html">Studio</a>
    <a href="artist.html">AI Artists</a>
    <a href="theory.html">Info & Systems</a>
  </nav>

  <!-- 3D WORLD -->
  <div class="spatial-viewport">
    <div class="spatial-world" id="spatial-world">
      <!-- Generated by JS -->
    </div>
  </div>

  <div class="spatial-scroller"></div>

  <script src="js/z-engine.js" defer></script>
  <script src="js/z-catalog.js" defer></script>
  <script src="js/zs-motion.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const world = document.getElementById('spatial-world');
        if (!world || typeof ZCatalog === 'undefined') return;
        
        // Remove standard body scroll, we map it via virtual scroller
        document.body.style.overflow = 'auto'; // ensure scroller works
        
        const works = Object.values(ZCatalog.WORKS).slice(0, 31); // load all 31 works in the void
        
        // Build the Orbiting Z-tunnel
        works.forEach((w, index) => {
            const item = document.createElement('a');
            item.href = 'artwork.html?id=' + w.id;
            item.className = 'spatial-item';
            
            // Spatial Distribution
            const spacingZ = 400; // depth between items
            const zPos = -(index * spacingZ);
            
            // Swirl math
            const angle = (index / works.length) * Math.PI * 2 * 6; // 6 rotations
            const radius = 250 + (Math.random() * 200);
            
            // X and Y offset in space
            const xPos = Math.cos(angle) * radius;
            const yPos = Math.sin(angle) * (radius * 0.7);
            
            item.style.transform = `translate3d(${xPos}px, ${yPos}px, ${zPos}px)`;
            item.dataset.z = zPos;
            
            item.innerHTML = `
                <div class="art-canvas" id="art-${index}"></div>
                <div class="item-meta">${w.id} • ${w.archetype}</div>
            `;
            world.appendChild(item);
            
            // Render deterministic canvas
            requestAnimationFrame(() => {
                ZEngine.render('#art-' + index, {
                    archetype: w.archetype,
                    palette: w.palette,
                    seed: w.seed,
                    density: w.density
                });
            });
        });

        // Native Scroll synced to Z-Axis translation
        let currentScroll = 0;
        let targetScroll = 0;
        
        window.addEventListener('scroll', () => {
            targetScroll = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop;
        }, { passive: true });

        const totalDepth = works.length * 400;
        
        function renderLoop() {
            // Smooth lerp scrolling
            currentScroll += (targetScroll - currentScroll) * 0.08;
            
            const scrollMax = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) - window.innerHeight;
            const progress = scrollMax > 0 ? (currentScroll / scrollMax) : 0;
            
            // Move camera forward
            const zTravel = progress * totalDepth;
            world.style.transform = `translateZ(${zTravel}px)`;
            
            // Depth of field (Lens blur) calculations
            document.querySelectorAll('.spatial-item').forEach(item => {
                const itemZ = parseFloat(item.dataset.z);
                const absoluteZ = itemZ + zTravel;
                
                // If it passes the camera lens
                if (absoluteZ > 400) {
                    item.style.opacity = 0;
                    item.style.pointerEvents = 'none';
                } else {
                    // Calculate distance from perfect focus (absoluteZ = 0 is plane)
                    const distance = Math.abs(absoluteZ);
                    let blur = 0;
                    let opac = 1;
                    
                    if (distance > 1500) {
                        opac = Math.max(0, 1 - (distance - 1500) / 1000);
                        blur = Math.min(20, (distance - 1500) / 100);
                    }
                    
                    item.style.opacity = opac;
                    item.style.filter = blur > 0 ? `blur(${blur}px)` : 'none';
                    item.style.pointerEvents = opac > 0.5 ? 'auto' : 'none';
                }
            });
            
            requestAnimationFrame(renderLoop);
        }
        
        requestAnimationFrame(renderLoop);
    });
  </script>
</body>
</html>
